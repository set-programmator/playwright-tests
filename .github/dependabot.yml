version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 10
    reviewers:
      - "your-team/qa-engineers"
    assignees:
      - "your-team/maintainers"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      playwright:
        patterns:
          - "@playwright/*"
          - "playwright"
      testing:
        patterns:
          - "*eslint*"
          - "*jest*" 
          - "*testing*"
      security:
        patterns:
          - "*security*"
          - "*audit*"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Enable version updates for Docker
  - package-ecosystem: "docker" 
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"