name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *' # Run daily at 2 AM
  workflow_dispatch: # Allow manual trigger
    inputs:
      test_tags:
        description: 'Test tags to run (e.g., @smoke, @regression)'
        required: false
        default: ''
      browser:
        description: 'Browser to test'
        required: false
        default: 'all'
        type: choice
        options:
        - all
        - chromium
        - firefox
        - webkit

env:
  NODE_VERSION: '18'
  PLAYWRIGHT_CACHE_PATH: ~/.cache/playwright

jobs:
  # Dependency and security audit
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run security audit
      run: npm run security:audit
    
    - name: Run linting
      run: npm run lint
    
    - name: Run type checking
      run: npm run type-check

  # Matrix testing strategy
  test:
    needs: audit
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4]
        exclude:
          # Skip webkit on non-mac for faster builds
          - os: ubuntu-latest
            browser: webkit
          - os: windows-latest  
            browser: webkit
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ${{ env.PLAYWRIGHT_CACHE_PATH }}
        key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install Playwright Browsers
      run: npx playwright install ${{ matrix.browser }}
    
    - name: Run tests with dynamic tags
      run: |
        if [ "${{ github.event.inputs.test_tags }}" != "" ]; then
          npx playwright test --project=${{ matrix.browser }} --grep "${{ github.event.inputs.test_tags }}" --shard=${{ matrix.shard }}/4
        else
          npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/4
        fi
      env:
        CI: true
        PLAYWRIGHT_WORKERS: 1
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.browser }}-${{ matrix.shard }}
        path: |
          test-results/
          playwright-report/
          allure-results/
        retention-days: 30
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: matrix.os == 'ubuntu-latest' && matrix.browser == 'chromium'
      with:
        files: ./coverage/lcov.info
        flags: e2e-tests

  # Performance and security testing job  
  quality-gates:
    needs: audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install Playwright
      run: npx playwright install chromium
    
    - name: Run security tests
      run: npm run test:security
    
    - name: Run performance tests  
      run: npm run performance:lighthouse
    
    - name: Run accessibility tests
      run: npx playwright test --grep "@accessibility"

  # Consolidated reporting
  report:
    needs: [test, quality-gates]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/
    
    - name: Merge test results
      run: |
        mkdir -p merged-results/allure-results
        find artifacts/ -name "*.json" -path "*/allure-results/*" -exec cp {} merged-results/allure-results/ \;
    
    - name: Generate Allure Report  
      uses: simple-elf/allure-report-action@master
      if: always()
      with:
        allure_results: merged-results/allure-results
        allure_history: allure-history
        keep_reports: 20
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: allure-history
    
    - name: Notify Slack on failure
      uses: 8398a7/action-slack@v3
      if: failure()
      with:
        status: failure
        channel: '#qa-alerts'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        
    - name: Comment PR with results
      uses: actions/github-script@v6
      if: github.event_name == 'pull_request'
      with:
        script: |
          const fs = require('fs');
          const path = 'merged-results/summary.json';
          if (fs.existsSync(path)) {
            const summary = JSON.parse(fs.readFileSync(path));
            const comment = `## 🧪 Test Results Summary
            
            **Total Tests:** ${summary.total}
            **Passed:** ${summary.passed} ✅  
            **Failed:** ${summary.failed} ❌
            **Skipped:** ${summary.skipped} ⏭️
            
            [View Full Report](https://your-org.github.io/playwright-boilerplate/)`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }